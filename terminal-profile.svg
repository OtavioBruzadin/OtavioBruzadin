<svg width="1600" height="820" viewBox="0 0 1600 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #020403; }
    .panel { fill: #020403; stroke: #19ff4d; stroke-width: 2.2; opacity: 0.9; }
    .topbar { stroke: #19ff4d; stroke-width: 2; opacity: 0.75; }
    .divider { stroke: #19ff4d; stroke-width: 2; opacity: 0.75; }
    .dot { fill: #19ff4d; opacity: 0.85; }
    .dot2 { fill: none; stroke: #19ff4d; stroke-width: 2; opacity: 0.7; }
    .text {
      font-family: "Fira Code", "Consolas", "Monaco", monospace;
      font-size: 29px;
      fill: #5cff3a;
      filter: url(#glow);
    }
    .title {
      font-family: "Fira Code", "Consolas", "Monaco", monospace;
      font-size: 28px;
      fill: #5cff3a;
      filter: url(#glow);
    }
    .small {
      font-family: "Fira Code", "Consolas", "Monaco", monospace;
      font-size: 25px;
      fill: #5cff3a;
      filter: url(#glow);
    }
    .line {
      opacity: 0;
      animation-name: show;
      animation-duration: .01s;
      animation-fill-mode: forwards;
      animation-timing-function: step-end;
    }
    @keyframes show { to { opacity: 1; } }

    .l01 { animation-delay: .3s; }
    .l02 { animation-delay: .8s; }
    .l03 { animation-delay: 1.3s; }
    .l04 { animation-delay: 1.8s; }
    .l05 { animation-delay: 2.3s; }
    .l06 { animation-delay: 2.8s; }
    .l07 { animation-delay: 3.3s; }
    .l08 { animation-delay: 3.8s; }
    .l09 { animation-delay: 4.3s; }
    .l10 { animation-delay: 4.8s; }
    .l11 { animation-delay: 5.3s; }
    .l12 { animation-delay: 5.8s; }
    .l13 { animation-delay: 6.3s; }
    .l14 { animation-delay: 6.8s; }
    .l15 { animation-delay: 7.3s; }
    .l16 { animation-delay: 7.8s; }
    .l17 { animation-delay: 8.3s; }
    .l18 { animation-delay: 8.8s; }
    .l19 { animation-delay: 9.3s; }
    .l20 { animation-delay: 9.8s; }
    .l21 { animation-delay: 10.3s; }
    .l22 { animation-delay: 10.8s; }
    .l23 { animation-delay: 11.3s; }
    .l24 { animation-delay: 11.8s; }
    .l25 { animation-delay: 12.3s; }
    .l26 { animation-delay: 12.8s; }

    .cursor {
      fill: #5cff3a;
      filter: url(#glow);
      animation: blink .9s step-end infinite;
    }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    .scanline {
      fill: url(#scan);
      opacity: .11;
    }

    .bar {
      transform-origin: left center;
      transform: scaleX(0);
      animation: loading 2.8s .8s forwards ease-out;
    }
    @keyframes loading {
      to { transform: scaleX(1); }
    }
  </style>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#19ff4d"/>
    </pattern>
  </defs>

  <rect class="bg" width="1600" height="820" rx="22"/>
  <rect class="panel" x="20" y="20" width="1560" height="780" rx="20"/>
  <line class="topbar" x1="20" y1="82" x2="1580" y2="82"/>

  <circle class="dot" cx="55" cy="52" r="12"/>
  <circle class="dot2" cx="92" cy="52" r="12"/>
  <circle class="dot2" cx="129" cy="52" r="12"/>
  <text class="title" x="180" y="62">otavio@dev-machine:~</text>

  <line class="divider" x1="800" y1="125" x2="800" y2="760"/>

  <rect class="scanline" x="20" y="20" width="1560" height="780" rx="20"/>

  <g>
    <text class="text line l01" x="65" y="145">$ boot developer-profile</text>

    <rect x="65" y="172" width="620" height="8" rx="4" stroke="#5cff3a" opacity=".5"/>
    <rect class="bar line l02" x="67" y="174" width="616" height="4" rx="2" fill="#5cff3a" opacity=".85"/>

    <text class="text line l03" x="65" y="220">Initializing...</text>
    <text class="text line l04" x="65" y="260">Loading modules</text>

    <text class="small line l05" x="100" y="300">[✓] backend</text>
    <text class="small line l06" x="475" y="300">............ OK</text>

    <text class="small line l07" x="100" y="338">[✓] systems</text>
    <text class="small line l08" x="475" y="338">............ OK</text>

    <text class="small line l09" x="100" y="376">[✓] ai</text>
    <text class="small line l10" x="475" y="376">............ OK</text>

    <text class="small line l11" x="100" y="414">[✓] passion</text>
    <text class="small line l12" x="475" y="414">............ OK</text>

    <text class="text line l13" x="65" y="465">System ready.</text>

    <text class="text line l14" x="65" y="520">$ whoami</text>

    <text class="text line l15" x="65" y="565">Otavio Augusto Bruzadin</text>
    <text class="text line l16" x="65" y="610">Backend Developer</text>

    <text class="small line l17" x="65" y="660">Curious by nature.</text>
    <text class="small line l18" x="65" y="694">Cat person.</text>
    <text class="small line l19" x="65" y="728">Robot enthusiast.</text>

    <text class="small line l20" x="65" y="775">I enjoy learning new things,</text>
  </g>

  <g>
    <text class="text line l21" x="850" y="165">$ cat mission.txt</text>

    <text class="text line l22" x="850" y="260">Write code with purpose.</text>
    <text class="text line l23" x="850" y="340">Build software that lasts.</text>
    <text class="text line l24" x="850" y="420">Create systems that scale.</text>
    <text class="text line l25" x="850" y="500">Solve real problems,</text>
    <text class="text line l26" x="850" y="540">one commit at a time.</text>

    <text class="text line l26" x="850" y="650">$</text>
    <rect class="cursor line l26" x="885" y="627" width="18" height="30"/>
  </g>
</svg>