<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #020403; }
    .panel { fill: #020403; stroke: #19ff4d; stroke-width: 2.2; opacity: 0.92; }
    .topbar { stroke: #19ff4d; stroke-width: 2; opacity: 0.75; }
    .divider { stroke: #19ff4d; stroke-width: 2; opacity: 0.75; }
    .dot { fill: #19ff4d; opacity: 0.85; }
    .dot2 { fill: none; stroke: #19ff4d; stroke-width: 2; opacity: 0.7; }

    .title {
      font-family: "Consolas", "Monaco", "Courier New", monospace;
      font-size: 28px;
      fill: #5cff3a;
      filter: url(#glow);
    }

    .text {
      font-family: "Consolas", "Monaco", "Courier New", monospace;
      font-size: 27px;
      fill: #5cff3a;
      filter: url(#glow);
    }

    .small {
      font-family: "Consolas", "Monaco", "Courier New", monospace;
      font-size: 23px;
      fill: #5cff3a;
      filter: url(#glow);
    }

    .line {
      opacity: 0;
      animation-name: show;
      animation-duration: .01s;
      animation-fill-mode: forwards;
      animation-timing-function: step-end;
    }

    @keyframes show { to { opacity: 1; } }

    .l01 { animation-delay: .2s; }
    .l02 { animation-delay: .7s; }
    .l03 { animation-delay: 1.2s; }
    .l04 { animation-delay: 1.7s; }
    .l05 { animation-delay: 2.2s; }
    .l06 { animation-delay: 2.7s; }
    .l07 { animation-delay: 3.2s; }
    .l08 { animation-delay: 3.7s; }
    .l09 { animation-delay: 4.2s; }
    .l10 { animation-delay: 4.7s; }
    .l11 { animation-delay: 5.2s; }
    .l12 { animation-delay: 5.7s; }
    .l13 { animation-delay: 6.2s; }
    .l14 { animation-delay: 6.7s; }
    .l15 { animation-delay: 7.2s; }
    .l16 { animation-delay: 7.7s; }
    .l17 { animation-delay: 8.2s; }
    .l18 { animation-delay: 8.7s; }
    .l19 { animation-delay: 9.2s; }
    .l20 { animation-delay: 9.7s; }
    .l21 { animation-delay: 10.2s; }
    .l22 { animation-delay: 10.7s; }
    .l23 { animation-delay: 11.2s; }
    .l24 { animation-delay: 11.7s; }
    .l25 { animation-delay: 12.2s; }
    .l26 { animation-delay: 12.7s; }
    .l27 { animation-delay: 13.2s; }
    .l28 { animation-delay: 13.7s; }
    .l29 { animation-delay: 14.2s; }

    .cursor {
      fill: #5cff3a;
      filter: url(#glow);
      animation: blink .9s step-end infinite;
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    .scanline {
      fill: url(#scan);
      opacity: .11;
    }

    .bar {
      transform-origin: left center;
      transform: scaleX(0);
      animation: loading 2.8s .8s forwards ease-out;
    }

    @keyframes loading {
      to { transform: scaleX(1); }
    }
  </style>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#19ff4d"/>
    </pattern>
  </defs>

  <rect class="bg" width="1600" height="920" rx="22"/>
  <rect class="panel" x="20" y="20" width="1560" height="880" rx="20"/>
  <line class="topbar" x1="20" y1="82" x2="1580" y2="82"/>

  <circle class="dot" cx="55" cy="52" r="12"/>
  <circle class="dot2" cx="92" cy="52" r="12"/>
  <circle class="dot2" cx="129" cy="52" r="12"/>
  <text class="title" x="180" y="62">otavio@dev-machine:~</text>

  <line class="divider" x1="805" y1="125" x2="805" y2="850"/>
  <rect class="scanline" x="20" y="20" width="1560" height="880" rx="20"/>

  <g>
    <text class="text line l01" x="65" y="135">$ boot developer-profile</text>

    <rect x="65" y="162" width="625" height="8" rx="4" stroke="#5cff3a" opacity=".5"/>
    <rect class="bar line l02" x="67" y="164" width="621" height="4" rx="2" fill="#5cff3a" opacity=".85"/>

    <text class="text line l03" x="65" y="205">Initializing...</text>

    <text class="small line l04" x="65" y="250">Loading backend module.............. DONE</text>
    <text class="small line l05" x="65" y="288">Loading software module............. DONE</text>
    <text class="small line l06" x="65" y="326">Loading AI module................... DONE</text>
    <text class="small line l07" x="65" y="364">Loading profile data................ DONE</text>

    <text class="text line l08" x="65" y="420">System ready.</text>

    <text class="text line l09" x="65" y="480">$ whoami</text>

    <text class="text line l10" x="65" y="528">Otavio Augusto Bruzadin</text>
    <text class="text line l11" x="65" y="576">Backend Developer</text>

    <text class="small line l12" x="65" y="634">Curious by nature.</text>
    <text class="small line l13" x="65" y="672">Cat person.</text>
    <text class="small line l14" x="65" y="710">Robot enthusiast.</text>

    <text class="small line l15" x="65" y="768">I enjoy learning new things,</text>
    <text class="small line l16" x="65" y="806">understanding how they work</text>
    <text class="small line l17" x="65" y="844">and turning ideas into software.</text>
  </g>

  <g>
    <text class="text line l18" x="855" y="165">$ cat mission.txt</text>

    <text class="text line l19" x="855" y="255">Write code with purpose.</text>
    <text class="text line l20" x="855" y="335">Build software that lasts.</text>
    <text class="text line l21" x="855" y="415">Create systems that scale.</text>
    <text class="text line l22" x="855" y="495">Solve real problems,</text>
    <text class="text line l23" x="855" y="535">one commit at a time.</text>

    <text class="text line l24" x="855" y="650">$</text>
    <rect class="cursor line l25" x="890" y="627" width="18" height="30"/>
  </g>
</svg>